<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Training Metrics</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='Tunning.css') }}">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">
            <img src="{{ url_for('static', filename='Images/Logo2.png') }}">
            <strong>ToTune</strong>
        </div>

        <nav>
            <a href="/">Home</a>
            <a href="/tune">Tune</a>
            <a href="/work">Workspace</a>
        </nav>
    </header>

    <!-- ===== CONTENT ===== -->
    <main class="container">

        <!-- STATUS -->
        <div class="status running" id="statusText">
            <span class="dot"></span>
            Training in progress
        </div>

        <!-- CHARTS -->
        <div class="chart-block">
            <h3>Loss</h3>
            <canvas id="lossChart"></canvas>
        </div>

        <div class="chart-block">
            <h3>Accuracy</h3>
            <canvas id="accuracyChart"></canvas>
        </div>

        <div class="chart-block">
            <h3>F1 Score</h3>
            <canvas id="f1Chart"></canvas>
        </div>

    </main>

    <!-- ===== SCRIPT (UNCHANGED LOGIC) ===== -->
    <script>
        let lossChart, accChart, f1Chart;

        function createChart(canvasId, label) {
            const ctx = document.getElementById(canvasId).getContext("2d");
            return new Chart(ctx, {
                type: "line",
                data: {
                    labels: [],
                    datasets: [{
                        label: label,
                        data: [],
                        borderWidth: 2,
                        tension: 0.35
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    scales: {
                        x: {
                            title: { display: true, text: "Epoch" }
                        }
                    }
                }
            });
        }

        lossChart = createChart("lossChart", "Loss");
        accChart = createChart("accuracyChart", "Accuracy");
        f1Chart = createChart("f1Chart", "F1");

        function updateCharts(data) {
            lossChart.data.labels = data.epochs;
            lossChart.data.datasets[0].data = data.loss;
            lossChart.update();

            accChart.data.labels = data.epochs;
            accChart.data.datasets[0].data = data.accuracy;
            accChart.update();

            f1Chart.data.labels = data.epochs;
            f1Chart.data.datasets[0].data = data.f1;
            f1Chart.update();
        }

        function pollTraining() {
            fetch("/lossdata")
                .then(res => res.json())
                .then(data => {
                    updateCharts(data);

                    if (data.done) {
                        const status = document.getElementById("statusText");
                        status.classList.remove("running");
                        status.classList.add("done");
                        status.innerHTML = `<span class="dot"></span> Training completed`;
                        clearInterval(timer);
                    }
                })
                .catch(err => console.error(err));
        }

        const timer = setInterval(pollTraining, 2000);
    </script>

</body>

</html>
